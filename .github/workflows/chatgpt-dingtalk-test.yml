name: ChatGPT DingTalk Test

on:
  push:
    paths:
      - '.github/workflows/chatgpt-dingtalk-test.yml'

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
    steps:
      - name: Send DingTalk test message
        shell: bash
        run: |
          echo 'triggered_at=2026-06-22T02:43:00Z'
          python3 - <<'PY'
          import os, time, hmac, hashlib, base64, urllib.parse, json, urllib.request, sys

          webhook = os.environ.get('DINGTALK_WEBHOOK', '').strip()
          secret = os.environ.get('DINGTALK_SECRET', '').strip()

          if not webhook:
              print('DINGTALK_WEBHOOK secret is missing')
              sys.exit(2)

          url = webhook
          if secret:
              timestamp = str(round(time.time() * 1000))
              string_to_sign = f'{timestamp}\n{secret}'
              sign = urllib.parse.quote_plus(base64.b64encode(
                  hmac.new(secret.encode('utf-8'), string_to_sign.encode('utf-8'), hashlib.sha256).digest()
              ).decode('utf-8'))
              sep = '&' if '?' in webhook else '?'
              url = f'{webhook}{sep}timestamp={timestamp}&sign={sign}'

          payload = {
              'msgtype': 'text',
              'text': {
                  'content': 'ChatGPT 钉钉机器人测试消息：GitHub Actions 外部执行链路发送成功。'
              }
          }
          data = json.dumps(payload, ensure_ascii=False).encode('utf-8')
          req = urllib.request.Request(url, data=data, headers={'Content-Type': 'application/json'}, method='POST')
          with urllib.request.urlopen(req, timeout=20) as resp:
              body = resp.read().decode('utf-8', errors='replace')
              print('HTTP', resp.status)
              print(body)
              if '"errcode":0' not in body.replace(' ', ''):
                  sys.exit(1)
          PY
